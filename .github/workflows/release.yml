name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (GNU toolchain, matches libmpv's MinGW import library)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
      # Optional code signing. Set VELA_SIGN to a command containing {file}, e.g.
      # signtool sign /fd sha256 /tr http://timestamp.acs.microsoft.com /td sha256 /dlib ... /dmdf ... {file}
      - name: Fetch libmpv + assembler, build exe, portable zip and installer
        env:
          VELA_SIGN: ${{ secrets.VELA_SIGN }}
        run: ./build.ps1 -Setup
      - uses: actions/upload-artifact@v4
        with:
          name: vela-windows
          path: |
            dist/*.exe
            dist/*.zip

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - run: cargo install cargo-deb --locked
      - run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vela-linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv dylibbundler
      # For Developer ID signing + notarization, import your certificate into a
      # keychain and set MACOS_SIGN_IDENTITY / MACOS_NOTARY_PROFILE here.
      - run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vela-macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
